name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: foliocrew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/foliocrew
      DIRECT_URL: postgresql://ci:ci@localhost:5432/foliocrew
      AUTH_SECRET: ci-secret-solo-para-pruebas-de-github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Antes de las pruebas: varias (ai-quota, storage-quota, agency-access...) crean filas reales
      # y necesitan que las tablas ya existan. Correr esto después (como hacía antes, solo dentro de
      # `npm run build`) deja la base vacía durante `npm test` y esas pruebas fallan con
      # "relation ... does not exist" — no es nada del código, es el orden de los pasos.
      - run: npx prisma migrate deploy
      - run: npm test
      # Vuelve a aplicar las migraciones (no-op si ya están) y compila: detecta migraciones rotas antes de producción.
      - run: npm run build
